<!-- Sustituye la sección placeholder original de brujulaModuleView por esta sección -->
<section id="brujulaModuleView" class="hidden">
  <div class="card brujulaPanel">
    <div class="brujulaTitle">
      <div><span class="brujulaTruck">🚚</span><h2>BRÚJULA Y RUTERO</h2>
      <p class="hint">Carga BYR APP (.xlsb, .xlsx o .xls). Cada carga reemplaza el informe anterior.</p></div>
    </div>
    <div class="upload brujulaUpload">
      <input id="brujulaFile" type="file" accept=".xlsb,.xlsx,.xls">
      <button type="button" id="brujulaUploadBtn">Procesar y reemplazar informe</button>
      <button type="button" id="brujulaDownloadBtn" class="secondary">Descargar informe Excel</button>
    </div>
    <p id="brujulaMessage" class="hint" role="status">Selecciona el archivo BYR APP para comenzar.</p>
    <div class="brujulaFilters">
      <input id="brujulaSearch" placeholder="Buscar en las 17 columnas…">
      <select id="brujulaCenterFilter"><option value="">Todos los centros</option></select>
      <select id="brujulaStatusFilter"><option value="">Todos los Status</option></select>
      <select id="brujulaDestinationFilter"><option value="">Todos los destinos</option></select>
    </div>
    <div class="brujulaSummary"><b id="brujulaCount">0 registros</b><span id="brujulaLoadedAt" class="hint">Informe aún no cargado</span></div>
    <div class="tableWrap brujulaTableWrap"><table><thead id="brujulaHead"></thead><tbody id="brujulaRows"></tbody></table></div>
  </div>
</section>
