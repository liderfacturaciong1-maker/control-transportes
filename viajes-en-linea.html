<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viajes en línea | CD Girardota</title><style>

</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.APP_CONFIG = {
  SUPABASE_URL: "https://hpejibfswwuzvoocuexq.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_vovy9dq_KXHa-54zDyOQmw_0tLgDZan"
};</script></head><body><main><h1>🚚 Viajes en línea</h1><p>CD Girardota · Registro rápido de transportes</p><form id="tripForm"><label for="t">Transporte</label><input id="t" maxlength="30" autocomplete="off" required placeholder="Ej. 8009017478"><label for="v">Viaje</label><input id="v" maxlength="80" autocomplete="off" required placeholder="Ej. REGUERO"><label for="p">Placa</label><input id="p" maxlength="15" autocomplete="off" required placeholder="Ej. TMW240"><label for="pin">PIN personal de acceso</label><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" required placeholder="PIN"><button id="send" type="submit">Guardar viaje en Control de Transportes</button><div id="status" aria-live="polite"></div></form><small>Los viajes se guardan directamente en Supabase y aparecen en la pestaña Viajes en línea al actualizar la aplicación.</small><p style="margin-bottom:0"><a href="index.html">Abrir Control de Transportes</a></p></main><script>
(()=>{const $=x=>document.getElementById(x),cfg=window.APP_CONFIG||{};let busy=false;
$('tripForm').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const msg=$('status');if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){msg.textContent='Falta configuración de conexión.';return}if(typeof window.supabase==='undefined'){msg.textContent='No se pudo cargar la biblioteca de Supabase. Verifica la conexión a Internet o las restricciones del navegador.';return}busy=true;$('send').disabled=true;msg.style.color='#244e69';msg.textContent='Guardando en Supabase…';try{const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const {data,error}=await sb.rpc('ct_online_trip_create_secure',{p_pin:$('pin').value.trim(),p_transporte:$('t').value.trim(),p_viaje:$('v').value.trim(),p_placa:$('p').value.trim()});if(error)throw Error(error.message);msg.style.color='#067747';msg.textContent='✓ Viaje registrado correctamente. Código interno: '+data;$('t').value='';$('v').value='';$('p').value='';$('pin').value='';$('t').focus()}catch(err){msg.style.color='#b42318';msg.textContent='No se pudo guardar: '+err.message}finally{busy=false;$('send').disabled=false}})})();</script></body></html>
