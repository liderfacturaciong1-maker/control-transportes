<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validaciones Operación</title><link rel="stylesheet" href="../styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><style>body{background:#edf5fb}.voShell{max-width:730px;margin:8vh auto;padding:26px}.voShell h1{color:#114369}.voShell input{width:100%;max-width:300px;padding:12px;border-radius:9px;margin:10px 0}.voShell button{margin:8px 0}#voStatus{min-height:25px}</style></head><body><main class="voShell card"><h1>📋 Validaciones Operación</h1><p>Acceso exclusivo para usuarios autorizados por el administrador.</p><div id="voLogin"><label>PIN de Control de Transportes<br><input id="voPin" type="password" autocomplete="off" placeholder="Ingresa tu PIN"></label><br><button id="voEnter" type="button">Validar acceso</button></div><p id="voStatus" role="status"></p><section id="voContent" hidden><h2>Acceso autorizado</h2><p>Espacio preparado para incorporar los formularios y procesos de Validaciones Operación.</p></section><p><a href="../index.html">← Volver a Control de Transportes</a></p></main><script>const $=id=>document.getElementById(id);$('voEnter').onclick=async()=>{const pin=$('voPin').value.trim();$('voStatus').textContent='Verificando acceso…';$('voContent').hidden=true;if(!pin){$('voStatus').textContent='Ingresa el PIN.';return;}try{const cfg=window.APP_CONFIG;if(!cfg?.SUPABASE_URL||!cfg?.SUPABASE_ANON_KEY)throw Error('Falta configuración de Supabase');const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const {data,error}=await sb.rpc('ct_validaciones_can_access',{p_pin:pin});$('voPin').value='';if(error)throw error;if(data!==true){$('voStatus').textContent='Acceso denegado. Solicita permiso al administrador.';return;}$('voLogin').hidden=true;$('voStatus').textContent='Permiso verificado correctamente.';$('voContent').hidden=false;}catch(e){$('voStatus').textContent='No se pudo comprobar el acceso. '+e.message;}};$('voPin').addEventListener('keydown',e=>{if(e.key==='Enter')$('voEnter').click()});</script></body></html>
